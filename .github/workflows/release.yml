# Release Pipeline — RealizeOS 5
# Triggered by version tags (v*.*.*) created by version-bump.yml (semantic-release)
# Flow: version-bump.yml → v*.*.* tag → this workflow
# Steps: CI → multi-arch Docker build+sign → npm publish → PyPI publish → GH Release

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v5.5.0)"
        required: true
        type: string

permissions:
  contents: write   # GH Release creation + CHANGELOG
  packages: write   # push to GHCR
  id-token: write   # npm provenance + cosign keyless signing

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  REGISTRY: ghcr.io
  IMAGE_NAME: sufzen/realizeos-5

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Run full CI first (reuse ci.yml)
  # ──────────────────────────────────────────────
  ci:
    name: CI Checks
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      security-events: write

  # ──────────────────────────────────────────────
  # Job 2: Multi-arch Docker Build + Push to GHCR
  # ──────────────────────────────────────────────
  docker-release:
    name: Docker Release (multi-arch)
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG=${{ inputs.tag || github.ref_name }}
          VERSION=${TAG#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major=$(echo $VERSION | cut -d. -f1)" >> "$GITHUB_OUTPUT"
          echo "minor=$(echo $VERSION | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push Docker image
        id: docker-build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign Docker image (keyless via GitHub OIDC)
        env:
          DIGEST: ${{ steps.docker-build.outputs.digest }}
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"

  # ──────────────────────────────────────────────
  # Job 3: npm Publish (CLI package)
  # ──────────────────────────────────────────────
  npm-publish:
    name: npm Publish (@realize-os/cli)
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        working-directory: realize-os-cli
        run: npm ci

      - name: Build CLI
        working-directory: realize-os-cli
        run: npm run build

      - name: Run tests
        working-directory: realize-os-cli
        run: npm test --if-present

      - name: Extract version from tag
        id: version
        run: |
          TAG=${{ inputs.tag || github.ref_name }}
          VERSION=${TAG#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set package version from tag
        working-directory: realize-os-cli
        run: npm version ${{ steps.version.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Publish to npm
        working-directory: realize-os-cli
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ──────────────────────────────────────────────
  # Job 4: PyPI Publish (Python package)
  # ──────────────────────────────────────────────
  pypi-publish:
    name: PyPI Publish (realize-os)
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      id-token: write  # OIDC-based trusted publishing
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools
        run: pip install build

      - name: Extract version from tag
        id: version
        run: |
          TAG=${{ inputs.tag || github.ref_name }}
          VERSION=${TAG#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set package version from tag
        run: |
          sed -i "s/^version = \".*\"/version = \"${{ steps.version.outputs.version }}\"/" pyproject.toml

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # ──────────────────────────────────────────────
  # Job 5: Create GitHub Release
  # ──────────────────────────────────────────────
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [docker-release, npm-publish, pypi-publish]
    # Run even if npm-publish or pypi-publish is skipped
    if: always() && needs.docker-release.result == 'success'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG=${{ inputs.tag || github.ref_name }}
          VERSION=${TAG#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        run: |
          # Get commits since last tag
          PREV_TAG=$(git tag --sort=-version:refname | head -2 | tail -1 || echo "")
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log --pretty=format:"- %s (%h)" "$PREV_TAG"..HEAD)
          else
            NOTES=$(git log --pretty=format:"- %s (%h)" -20)
          fi
          # Write to file for the release
          {
            echo "## RealizeOS ${{ steps.version.outputs.version }}"
            echo ""
            echo "### Docker"
            echo '```bash'
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"
            echo '```'
            echo ""
            echo "### npm CLI"
            echo '```bash'
            echo "npx @realize-os/cli@${{ steps.version.outputs.version }} init"
            echo '```'
            echo ""
            echo "### Changes"
            echo "$NOTES"
          } > release-notes.md

      - name: Package Lite install artifact
        run: |
          zip -r "RealizeOS-Lite-${{ steps.version.outputs.version }}.zip" realize_lite README.md docs/lite-guide.md docs/upgrade-from-v03.md
          sha256sum "RealizeOS-Lite-${{ steps.version.outputs.version }}.zip" > "RealizeOS-Lite-${{ steps.version.outputs.version }}.zip.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: RealizeOS ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: |
            RealizeOS-Lite-${{ steps.version.outputs.version }}.zip
            RealizeOS-Lite-${{ steps.version.outputs.version }}.zip.sha256
            CHANGELOG.md
          draft: false
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
