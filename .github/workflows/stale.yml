# Stale issues and PRs
# Close inactive issues after 90 days, PRs after 30 days

name: Stale

on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6 AM UTC

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark stale issues and PRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          # Issues
          days-before-stale: 60
          days-before-close: 30
          stale-issue-label: stale
          stale-issue-message: >
            This issue has been inactive for 60 days. It will be closed in
            30 days unless there is new activity. If this is still relevant,
            please comment to keep it open.
          close-issue-message: >
            Closed due to inactivity. Feel free to reopen if this is still needed.
          exempt-issue-labels: pinned,security,spec,v5.5.0

          # Pull Requests
          days-before-pr-stale: 21
          days-before-pr-close: 14
          stale-pr-label: stale
          stale-pr-message: >
            This PR has been inactive for 21 days. It will be closed in
            14 days unless updated. If this work is still in progress,
            please push an update or comment.
          close-pr-message: >
            Closed due to inactivity. Feel free to reopen when ready to continue.
          exempt-pr-labels: pinned,do-not-close

          # Limits
          operations-per-run: 50
