# Pre-commit hooks — RealizeOS v5.5.0
# Install: pre-commit install && pre-commit install --hook-type commit-msg
# Run all: pre-commit run --all-files

repos:
  # ── General file hygiene ──────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=auto]

  # ── Python: ruff lint + format ────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # ── Markdown lint ───────────────────────────────
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.17.2
    hooks:
      - id: markdownlint-cli2
        args: ["--config", ".markdownlint-cli2.jsonc"]

  # ── Conventional Commits ──────────────────────────
  - repo: local
    hooks:
      - id: commitlint
        name: Conventional Commits (commitlint)
        entry: npx --no-install commitlint --edit
        language: system
        stages: [commit-msg]
        always_run: true
