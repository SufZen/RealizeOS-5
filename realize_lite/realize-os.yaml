# To add more systems: copy a block above, uncomment it, and update the key, name, directory, and description.
# Or simply ask: "Create a new venture" and the AI will set it up for you.

# Shared resources (applies to all systems)
shared:
  identity: shared/identity.md
  preferences: shared/user-preferences.md
  methods: shared/methods/

# Features (toggle on/off)
features:
  review_pipeline: true     # Require reviewer approval for publishable content
  auto_memory: true         # Automatically log learnings to I-insights/
  proactive_mode: true      # AI suggests next steps and asks clarifying questions
  cross_system: false       # Enable cross-system context (for multi-system setups)
  email_digest: false       # Email a daily Dream Inbox digest (see email_digest block)
  dreaming_curator: false   # Run the Curator on a schedule, per venture (see dreaming block)

# Email Dream Inbox digest — push-only outbound channel.
# Disabled by default; set features.email_digest: true to enable.
# Requires Google Workspace credentials (the `gws` extra + OAuth setup).
email_digest:
  recipient: info@realization.co.il   # Where the digest is emailed
  base_url: ""                        # Public base URL for approve/reject links, e.g. https://app.example.com
  hour: 8                             # Wall-clock hour (0–23) the digest fires
  workdays_only: true                 # Only run Mon–Fri (false → every day)
  timezone: "Europe/Lisbon"           # Time zone for the schedule

# Scheduled Curator — generates FABRIC-hygiene proposals per venture on a schedule.
# Disabled by default; set features.dreaming_curator: true to enable.
dreaming:
  hour: 3                             # Wall-clock hour (0–23) the Curator runs daily
  timezone: "Europe/Lisbon"           # Time zone for the schedule
